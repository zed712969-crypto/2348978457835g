<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>геогессер.рф - Скоро</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Анимация загрузки */
@keyframes load-bar {
    0% { width: 0%; }
    50% { width: 40%; }
    100% { width: 75%; }
}
.animate-load {
    animation: load-bar 15s cubic-bezier(0.2, 0, 0.2, 1) forwards;
}
@keyframes shimmer {
    100% { transform: translateX(100%); }
}
        body { font-family: system-ui, -apple-system, sans-serif; }
        @keyframes float {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .blob {
            position: absolute;
            filter: blur(80px);
            opacity: 0.6;
            animation: float 10s infinite ease-in-out;
            z-index: 0;
        }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        .neon-text {
            text-shadow: 0 0 10px rgba(236, 72, 153, 0.5), 0 0 20px rgba(236, 72, 153, 0.3);
        }
    </style>
</head>
<body class="bg-[#0f0f13] text-white h-screen flex flex-col items-center justify-center p-4 overflow-hidden relative">

    <!-- ФОН -->
    <div class="blob bg-purple-600 w-96 h-96 rounded-full top-0 left-[-100px]"></div>
    <div class="blob bg-blue-600 w-80 h-80 rounded-full bottom-0 right-[-100px] animation-delay-2000"></div>

    <!-- ЦЕНТРАЛЬНАЯ КАРТОЧКА -->
    <div class="glass relative z-10 p-10 md:p-14 rounded-3xl text-center max-w-2xl w-full mx-4 shadow-2xl border-t border-white/20 mb-16">
        
        <div class="inline-block px-4 py-1.5 mb-6 glass rounded-full text-xs font-bold tracking-widest text-blue-300 border border-white/10 uppercase">
            🚀 Coming Soon
        </div>

        <h1 class="text-5xl md:text-7xl font-black mb-4 tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white to-gray-400">
            геогессер.рф
        </h1>

        <p class="text-gray-300 text-lg mb-8 leading-relaxed font-light">
            Убийца зарубежных аналогов. <br>
            <span class="text-white font-medium">Россия. СНГ. Твой двор.</span>
        </p>

       <!-- PROGRESS BAR -->
<div class="w-full h-1.5 bg-white/10 rounded-full mb-8 overflow-hidden">
    <div class="h-full bg-gradient-to-r from-blue-500 via-purple-500 to-pink-500 rounded-full shadow-[0_0_15px_rgba(168,85,247,0.8)] animate-load w-[75%] relative overflow-hidden">
        <!-- Блик (Shine effect) -->
        <div class="absolute top-0 left-0 bottom-0 right-0 bg-gradient-to-r from-transparent via-white/30 to-transparent w-full -translate-x-full animate-[shimmer_2s_infinite]"></div>
    </div>
</div>

        <!-- ТОЛЬКО ДОНАТ -->
        <div class="flex justify-center">
            <a href="https://pay.cloudtips.ru/p/2048b35a" class="group relative inline-flex items-center justify-center gap-3 px-8 py-4 bg-white/10 hover:bg-white/20 border border-white/10 rounded-xl transition-all duration-300 hover:scale-[1.02] hover:shadow-[0_0_20px_rgba(255,255,255,0.1)]">
                <span class="text-2xl">☕</span>
                <div class="text-left">
                    <div class="text-[10px] text-gray-400 font-medium uppercase tracking-wider">Support Dev</div>
                    <div class="text-sm font-bold text-white">Снабдить Кофеином</div>
                </div>
            </a>
        </div>

    </div>

        <!-- ПОДВАЛ (БРЕНД + ЗАКАЗ) -->
    <footer class="absolute bottom-8 text-center z-10 w-full flex flex-col items-center gap-2">
        
        <!-- БРЕНД -->
        <div class="text-lg font-bold tracking-[0.2em] uppercase bg-clip-text text-transparent bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 neon-text animate-pulse">
            малинка.dev
        </div>

        <!-- КНОПКА ЗАКАЗА (Micro) -->
        <a href="https://малинкамалинкин.рф" target="_blank" class="text-[10px] text-white/30 hover:text-white transition-colors duration-300 tracking-[0.15em] uppercase font-mono border-b border-transparent hover:border-white/50 pb-0.5">
            купить сайт / скрипт на python
        </a>

    </footer>
</body>
</html>
